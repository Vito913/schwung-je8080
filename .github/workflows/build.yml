name: Build

# Builds from a CLEAN CHECKOUT on every push and PR, which is the point: the
# gearmulator submodule was pinned to a commit that did not compile and nobody
# noticed, because every local build passed -DGEARMULATOR_SOURCE pointing at a
# worktree somewhere else. If this job is green, `git clone --recursive` builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Only what the plugin links. A full --recursive pull drags in JUCE,
      # RmlUi and freetype for the desktop editor -- 1.1 GB we never compile.
      - name: Init the submodules the plugin needs
        run: |
          git submodule update --init libs/gearmulator
          git -C libs/gearmulator submodule update --init source/cpu/dsp56300 source/cpu/mc68k
          git -C libs/gearmulator/source/cpu/dsp56300 submodule update --init source/asmjit

      # JE-8080: the synthetic boot block's runtime helpers, on jeLib's own
      # H8S core. Needs only the dsp56300/h8s sources, no ROM.
      - name: Boot block helper tests
        run: ./tests/boot/run.sh

      - name: Build (cross-compiles to aarch64 in Docker)
        run: ./scripts/build.sh

      - name: Check the artifact is actually ARM64
        run: |
          test -f dist/je8080-module.tar.gz
          file dist/je8080/dsp.so | tee /dev/stderr | grep -q 'ARM aarch64'

      - uses: actions/upload-artifact@v4
        with:
          name: je8080-module
          path: dist/je8080-module.tar.gz
